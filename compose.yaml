name: ${COMPOSE_PROJECT_NAME:-agrojud-demo}

services:
  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the selected environment file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the selected environment file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the selected environment file}
    volumes:
      - database-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 60s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    image: agrojud-backend:local
    environment:
      AGROJUD_ENV: ${AGROJUD_ENV:-demo}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the selected environment file}
      DATAJUD_API_KEY: ${DATAJUD_API_KEY:-}
      DATAJUD_READ_TIMEOUT_SECONDS: ${DATAJUD_READ_TIMEOUT_SECONDS:-60}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-120}
      JOB_HEARTBEAT_SECONDS: ${JOB_HEARTBEAT_SECONDS:-20}
      JOB_POLL_SECONDS: ${JOB_POLL_SECONDS:-2}
      EXPORT_PROCESS_LIMIT: ${EXPORT_PROCESS_LIMIT:-50000}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://127.0.0.1:5173}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 45s
    restart: unless-stopped
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: agrojud-frontend:local
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 10s

  worker:
    image: agrojud-backend:local
    environment:
      AGROJUD_ENV: ${AGROJUD_ENV:-demo}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the selected environment file}
      DATAJUD_API_KEY: ${DATAJUD_API_KEY:-}
      DATAJUD_READ_TIMEOUT_SECONDS: ${DATAJUD_READ_TIMEOUT_SECONDS:-60}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-120}
      JOB_HEARTBEAT_SECONDS: ${JOB_HEARTBEAT_SECONDS:-20}
      JOB_POLL_SECONDS: ${JOB_POLL_SECONDS:-2}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    profiles: ["worker"]
    command: ["uv", "run", "--no-sync", "agrojud-worker"]
    restart: unless-stopped
    stop_grace_period: 45s

volumes:
  database-data:
