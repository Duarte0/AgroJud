name: ${COMPOSE_PROJECT_NAME:-agrojud-test}

services:
  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set a test POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set a test POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a test POSTGRES_PASSWORD}
    volumes:
      - test-database-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${TEST_DB_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  tests:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    image: agrojud-backend-test:local
    environment:
      AGROJUD_ENV: test
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/agrojud_demo
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATAJUD_API_KEY: ${DATAJUD_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["test"]
    command: ["uv", "run", "--no-sync", "pytest"]

volumes:
  test-database-data:
