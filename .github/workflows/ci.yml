name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install uv and the pinned Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.22
          python-version: 3.14.8
          working-directory: backend

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify generated OpenAPI and TypeScript contract
        working-directory: frontend
        run: npm ci && npm run openapi:check

      - name: Lint, typecheck, unit test, and build the frontend
        working-directory: frontend
        run: npm run lint && npm run typecheck && npm test && npm run build

      - name: Create local-only environment files
        run: |
          cp .env.demo.example .env.demo
          cp .env.test.example .env.test

      - name: Build and smoke the API with PostgreSQL
        run: ./scripts/smoke-compose.sh demo

      - name: Lint, typecheck, and test with PostgreSQL
        run: |
          docker compose --project-name agrojud-ci-test --env-file .env.test -f compose.test.yaml --profile test run --rm --build tests sh -lc 'uv run --no-sync ruff check src tests && uv run --no-sync ruff format --check src tests && uv run --no-sync mypy src && uv run --no-sync pytest'

      - name: Verify PostgreSQL persistence across restart
        run: ./scripts/verify-persistence.sh

      - name: Browser flow against the isolated demo stack
        run: |
          cp .env.e2e.example .env.e2e
          (cd frontend && npx playwright install --with-deps chromium)
          ./scripts/e2e.sh
